
name: Keep Comic Verse Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove unrelated files
        run: |
          python - <<'PY'
          import subprocess

          keep = {
              ".github/workflows/deploy.yml",
              "dist/manga/repo.json",
              "dist/manga/comic-verse.plugin.js",
              "plugins/manga/comic-verse/index.ts",
              "plugins/manga/comic-verse/manifest.json",
          }

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          for path in files:
              if path and path not in keep:
                  subprocess.run(
                      ["git", "rm", "-f", "--", path],
                      check=True
                  )
          PY

      - name: Commit and push cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep only Comic Verse"
          git push
